<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NWA Training</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0e14;color:#cdd6f4;font:13px/1.4 'SF Mono',monospace;padding:24px 28px;max-width:1200px;margin:0 auto}
  .top{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
  h1{font-size:18px;color:#89b4fa;font-weight:700}
  .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
  .bg{background:#1e3a5f;color:#89b4fa}.bl{background:#1a3a1a;color:#a6e3a1;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .prog{background:#181825;border-radius:6px;height:3px;margin:8px 0 14px;overflow:hidden}
  .prog>div{height:100%;background:linear-gradient(90deg,#89b4fa,#a6e3a1);border-radius:6px;transition:width .5s}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;margin-bottom:14px}
  .card{background:#11121c;border:1px solid #1e2030;border-radius:8px;padding:10px 12px}
  .card .l{font-size:9px;color:#585b70;text-transform:uppercase;letter-spacing:.5px}.card .v{font-size:24px;font-weight:800;line-height:1.1}.card .s{font-size:10px;color:#45475a;margin-top:2px}
  .g{color:#a6e3a1}.y{color:#f9e2af}.r{color:#f38ba8}.b{color:#89b4fa}.d{color:#6c7086}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:800px){.charts{grid-template-columns:1fr}}
  .ch{background:#11121c;border:1px solid #1e2030;border-radius:8px;padding:10px 14px 8px}
  .ch h3{font-size:10px;color:#585b70;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .ch canvas{width:100%;height:180px;display:block}
  .foot{margin-top:10px;font-size:10px;color:#45475a;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="top">
  <h1>NWA Training</h1>
  <span class="badge bg">GPU · 64w · 512h</span>
  <span class="badge bl" id="live">LIVE</span>
</div>
<div class="prog"><div id="prog" style="width:0%"></div></div>
<div class="cards" id="cards"></div>
<div class="charts">
  <div class="ch"><h3>Avg Reward — total score per episode (higher = better)</h3><canvas id="c0"></canvas></div>
  <div class="ch"><h3>Entropy — policy randomness (lower = more confident)</h3><canvas id="c1"></canvas></div>
  <div class="ch"><h3>Value Loss — critic prediction error</h3><canvas id="c2"></canvas></div>
  <div class="ch"><h3>Avg Length — ticks per episode</h3><canvas id="c3"></canvas></div>
</div>
<div class="foot"><span id="st">Waiting…</span><span id="sp"></span></div>

<script>
const MAX=400,H={rew:[],ent:[],vl:[],len:[]};let ls=0,lt=Date.now();
async function poll(){
  try{const r=await fetch("/training_status.json");if(!r.ok)return;const s=await r.json();
    const n=Date.now(),dt=(n-lt)/1000,ds=s.steps-ls,sps=dt>0?Math.round(ds/dt):0;ls=s.steps;lt=n;
    document.getElementById("prog").style.width=(s.iter/2000*100)+"%";
    document.getElementById("cards").innerHTML=
      `<div class="card"><div class="l">Avg Reward</div><div class="v ${s.avg_rew>80?'g':s.avg_rew>30?'y':'r'}">${s.avg_rew.toFixed(1)}</div><div class="s">total score per episode</div></div>
       <div class="card"><div class="l">Entropy</div><div class="v ${s.ent<8?'g':s.ent<12?'y':'r'}">${s.ent.toFixed(2)}</div><div class="s">max 13.86 · target &lt;6</div></div>
       <div class="card"><div class="l">Value Loss</div><div class="v ${s.v_loss<.15?'g':'y'}">${s.v_loss.toFixed(3)}</div><div class="s">critic error</div></div>
       <div class="card"><div class="l">Iteration</div><div class="v b">${s.iter}<span class="d" style="font-size:14px">/2000</span></div><div class="s">${(s.iter/2000*100).toFixed(0)}% · ${(s.steps/1e6).toFixed(1)}M steps</div></div>
       <div class="card"><div class="l">Speed</div><div class="v d">${sps}</div><div class="s">steps/sec</div></div>
       <div class="card"><div class="l">Avg Length</div><div class="v d">${s.avg_len.toFixed(0)}</div><div class="s">ticks per episode</div></div>`;
    push(H.rew,s.avg_rew);push(H.ent,s.ent);push(H.vl,s.v_loss);push(H.len,s.avg_len);
    chart("c0",[{d:H.rew,c:"#a6e3a1",lo:0,hi:200}]);
    chart("c1",[{d:H.ent,c:"#f38ba8",lo:0,hi:14}]);
    chart("c2",[{d:H.vl,c:"#89b4fa",lo:0,hi:5}]);
    chart("c3",[{d:H.len,c:"#f9e2af",lo:0,hi:500}]);
    document.getElementById("st").textContent=`Updated ${new Date().toLocaleTimeString()}`;
    document.getElementById("sp").textContent=`${sps} steps/sec`;
  }catch(e){}
}
function push(a,v){a.push(v);if(a.length>MAX)a.shift()}
function chart(id,series){
  const c=document.getElementById(id),ctx=c.getContext("2d"),W=c.parentElement.clientWidth-28,H=180,PL=36,PR=6,PT=4,PB=18;
  c.width=W;ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="#1a1b26";ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=PT+(H-PT-PB)*i/4;ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke()}
  ctx.fillStyle="#45475a";ctx.font="9px monospace";ctx.textAlign="right";
  for(let i=0;i<=4;i++){const y=PT+(H-PT-PB)*(4-i)/4;ctx.fillText((series[0].lo+(series[0].hi-series[0].lo)*i/4).toFixed(0),PL-5,y+3)}
  for(const s of series){if(s.d.length<2)continue;
    const xs=(W-PL-PR)/Math.max(s.d.length-1,1),ys=(H-PT-PB)/(s.hi-s.lo||1);
    const grad=ctx.createLinearGradient(0,PT,0,H-PB);grad.addColorStop(0,s.c+"44");grad.addColorStop(1,s.c+"04");
    ctx.fillStyle=grad;ctx.beginPath();
    for(let i=0;i<s.d.length;i++){const x=PL+i*xs,y=PT+(H-PT-PB)-(s.d[i]-s.lo)*ys;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.lineTo(PL+(s.d.length-1)*xs,H-PB);ctx.lineTo(PL,H-PB);ctx.closePath();ctx.fill();
    ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<s.d.length;i++){const x=PL+i*xs,y=PT+(H-PT-PB)-(s.d[i]-s.lo)*ys;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke();
  }
}
poll();setInterval(poll,3000);
</script>
</body>
</html>
