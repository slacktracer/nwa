<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NWA Training</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0e14;color:#cdd6f4;font:13px/1.4 'SF Mono',monospace;padding:24px 28px;max-width:1200px;margin:0 auto}
  .top{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
  h1{font-size:18px;color:#89b4fa;font-weight:700}
  .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
  .bg{background:#1e3a5f;color:#89b4fa}.bl{background:#1a3a1a;color:#a6e3a1;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .prog{background:#181825;border-radius:6px;height:3px;margin:8px 0 14px;overflow:hidden}
  .prog>div{height:100%;background:linear-gradient(90deg,#89b4fa,#a6e3a1);border-radius:6px;transition:width .5s}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;margin-bottom:14px}
  .card{background:#11121c;border:1px solid #1e2030;border-radius:8px;padding:10px 12px}
  .card .l{font-size:9px;color:#585b70;text-transform:uppercase;letter-spacing:.5px}.card .v{font-size:24px;font-weight:800;line-height:1.1}.card .s{font-size:10px;color:#45475a;margin-top:2px}
  .g{color:#a6e3a1}.y{color:#f9e2af}.r{color:#f38ba8}.b{color:#89b4fa}.d{color:#6c7086}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:800px){.charts{grid-template-columns:1fr}}
  .ch{background:#11121c;border:1px solid #1e2030;border-radius:8px;padding:10px 14px 8px}
  .ch h3{font-size:10px;color:#585b70;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .ch canvas{width:100%;height:180px;display:block}
  .foot{margin-top:10px;font-size:10px;color:#45475a;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="top">
  <h1>NWA Training</h1>
  <span class="badge bg" id="mode">ES · 64p · 256h</span>
  <span class="badge bl" id="live">LIVE</span>
</div>
<div class="prog"><div id="prog" style="width:0%"></div></div>
<div class="cards" id="cards"></div>
<div class="charts">
  <div class="ch"><h3>Mean Fitness — population average per generation</h3><canvas id="c0"></canvas></div>
  <div class="ch"><h3>Best Fitness — best individual ever found</h3><canvas id="c1"></canvas></div>
  <div class="ch"><h3>Avg20 — rolling 20-generation mean</h3><canvas id="c2"></canvas></div>
  <div class="ch"><h3>—</h3><canvas id="c3"></canvas></div>
</div>
<div class="foot"><span id="st">Waiting…</span><span id="sp"></span></div>

<script>
const MAX=400,H={fit:[],best:[],avg20:[]};let lastT=Date.now();
async function poll(){
  try{const r=await fetch("/training_status.json");if(!r.ok)return;const s=await r.json();
    const isES = "generation" in s;
    document.getElementById("live").textContent = isES ? "ES · LIVE" : "PPO · LIVE";
    document.getElementById("live").className = isES ? "badge bl" : "badge bg";

    if (isES) {
      const pct = s.generation / 500 * 100;
      document.getElementById("prog").style.width = pct + "%";
      document.getElementById("cards").innerHTML =
        `<div class="card"><div class="l">Mean Fitness</div><div class="v ${s.fitness>5?'g':s.fitness>0?'y':'r'}">${s.fitness.toFixed(2)}</div><div class="s">population average</div></div>
         <div class="card"><div class="l">Best Fitness</div><div class="v ${s.best_fitness>10?'g':s.best_fitness>5?'y':'r'}">${s.best_fitness.toFixed(2)}</div><div class="s">best individual ever</div></div>
         <div class="card"><div class="l">Avg20</div><div class="v ${s.avg20>5?'g':s.avg20>0?'y':'r'}">${s.avg20.toFixed(2)}</div><div class="s">rolling 20-gen mean</div></div>
         <div class="card"><div class="l">Generation</div><div class="v b">${s.generation}<span class="d" style="font-size:14px">/500</span></div><div class="s">${pct.toFixed(0)}% · ${(s.total_evals/1000).toFixed(1)}k evals</div></div>`;
      push(H.fit, s.fitness); push(H.best, s.best_fitness); push(H.avg20, s.avg20);
      chart("c0",[{d:H.fit,c:"#a6e3a1",lo:-15,hi:25}], "Fitness");
      chart("c1",[{d:H.best,c:"#f9e2af",lo:-15,hi:25}], "Best");
      chart("c2",[{d:H.avg20,c:"#89b4fa",lo:-15,hi:25}], "Avg20");
      document.getElementById("c3").parentElement.style.display="none";
    } else {
      // Legacy PPO mode
      const n=Date.now(),dt=(n-lastT)/1000,ds=(s.steps||0)-(+document.getElementById("prog").dataset.steps||0),sps=dt>0?Math.round(ds/dt):0;
      document.getElementById("prog").dataset.steps = s.steps||0; lastT=n;
      document.getElementById("prog").style.width=(s.iter/2000*100)+"%";
      document.getElementById("cards").innerHTML=
        `<div class="card"><div class="l">Avg Reward</div><div class="v ${s.avg_rew>80?'g':s.avg_rew>30?'y':'r'}">${(s.avg_rew||0).toFixed(1)}</div><div class="s">total score per episode</div></div>
         <div class="card"><div class="l">Entropy</div><div class="v ${s.ent<8?'g':s.ent<12?'y':'r'}">${(s.ent||0).toFixed(2)}</div><div class="s">max 13.86</div></div>
         <div class="card"><div class="l">Iteration</div><div class="v b">${s.iter}<span class="d" style="font-size:14px">/2000</span></div><div class="s">${((s.iter||0)/2000*100).toFixed(0)}% · ${((s.steps||0)/1e6).toFixed(1)}M steps</div></div>`;
      document.getElementById("c3").parentElement.style.display="";
    }
    document.getElementById("st").textContent=`Updated ${new Date().toLocaleTimeString()}`;
  }catch(e){}
}
function push(a,v){a.push(v);if(a.length>MAX)a.shift()}
function chart(id,series,title){
  const c=document.getElementById(id),ctx=c.getContext("2d"),W=c.parentElement.clientWidth-28,H=180,PL=36,PR=6,PT=16,PB=18;
  c.width=W;ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#585b70";ctx.font="10px monospace";ctx.textAlign="left";
  ctx.fillText(title,PL,12);
  ctx.strokeStyle="#1a1b26";ctx.lineWidth=1;
  const lo=series[0].lo,hi=series[0].hi;
  for(let i=0;i<=4;i++){const y=PT+(H-PT-PB)*i/4;ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke()}
  ctx.fillStyle="#45475a";ctx.font="9px monospace";ctx.textAlign="right";
  for(let i=0;i<=4;i++){const y=PT+(H-PT-PB)*(4-i)/4;ctx.fillText((lo+(hi-lo)*i/4).toFixed(0),PL-5,y+3)}
  for(const s of series){if(s.d.length<2)continue;
    const xs=(W-PL-PR)/Math.max(s.d.length-1,1),ys=(H-PT-PB)/(s.hi-s.lo||1);
    const grad=ctx.createLinearGradient(0,PT,0,H-PB);grad.addColorStop(0,s.c+"44");grad.addColorStop(1,s.c+"04");
    ctx.fillStyle=grad;ctx.beginPath();
    for(let i=0;i<s.d.length;i++){const x=PL+i*xs,y=PT+(H-PT-PB)-(s.d[i]-s.lo)*ys;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.lineTo(PL+(s.d.length-1)*xs,H-PB);ctx.lineTo(PL,H-PB);ctx.closePath();ctx.fill();
    ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<s.d.length;i++){const x=PL+i*xs,y=PT+(H-PT-PB)-(s.d[i]-s.lo)*ys;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke();
  }
}
poll();setInterval(poll,3000);
</script>
</body>
</html>
